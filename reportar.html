<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Nuevo Rescate</title>
</head>
<body>
    <header>
        <h1>Refugio Huellas Amazónicas</h1>
        <p>Módulo de Registro de Animales Rescatados</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar Rescate</a></li>
            <li><a href="rescates.html">Casos Registrados</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulario de Ingreso de Animal Rescatado</h2>
            <article>
                <h3>Detalles del Reporte</h3>

                <form action="rescates.html" method="GET">

                    <!-- Datos de contacto -->
                    <div>
                        <label for="nombre">Nombre:</label><br>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <br>

                    <div>
                        <label for="correo">Correo:</label><br>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <br>

                    <!-- Categoría mediante lista desplegable -->
                    <div>
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">-- Seleccione una categoría --</option>
                            <option value="perros">Perros</option>
                            <option value="gatos">Gatos</option>
                            <option value="fauna">Fauna Silvestre</option>
                            <option value="fauna">Equinos</option>
                            <option value="fauna">Bovinos</option>
                            <option value="fauna">Ovinos</option>
                            <option value="fauna">Porcinos</option>
                            <option value="fauna">Primates</option>
                            <option value="fauna">Aves</option>
                            <option value="fauna">Reptiles</option>
                            <option value="fauna">Roedores</option>
                        </select>
                    </div>
                    <br>

                    <!-- Nivel de urgencia médica -->
                    <div>
                        <label>Nivel de Urgencia Médica:</label><br>

                        <input type="radio" id="urgencia-alta" name="urgencia" value="Alta" required>
                        <label for="urgencia-alta">Alta</label><br>

                        <input type="radio" id="urgencia-media" name="urgencia" value="Media">
                        <label for="urgencia-media">Media</label><br>

                        <input type="radio" id="urgencia-baja" name="urgencia" value="Baja">
                        <label for="urgencia-baja">Baja</label>
                    </div>
                    <br>

                    <!-- Descripción detallada -->
                    <div>
                        <label for="descripcion">Descripción detallada del estado:</label><br>
                        <textarea id="descripcion" name="descripcion" rows="4" cols="50" placeholder="Describa el estado en que se encontró al animal..." required></textarea>
                    </div>
                    <br>

                    <!-- Botones del formulario -->
                    <div>
                        <button type="submit">Enviar contacto</button>
                        <button type="reset">Limpiar formulario</button>
                    </div>

                </form>

            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Rescate y Adopción. Desarrollado por Carlos Bustos.</p>
    </footer>
</body>
</html>
